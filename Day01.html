<html>
  <head>
    <title>Game Loop</title>
    <style>
        *{
            margin: 0;
            overflow: hidden;
        }
    </style>
  </head>
  <body>
    <canvas id="canv"> </canvas>
    <script src="Vector2.js"></script>
    <script>
        let canvas = document.querySelector("#canv");
        let ctx = canvas.getContext("2d");

        
        let position = new Vector2(250, 250);
        
        function gameLoop(){
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }
        
        function update() {
            
            position.y = position.y + 7
        }
        
        function draw() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            //Signaling to the context that I'm going to draw something
            ctx.save();

            //set center of our object
            ctx.translate(position.x, position.y);

            //lightning draw from center just set in line 20
            ctx.lineTo(-10, -10);
            ctx.lineTo(10, -10);
            ctx.lineTo(0, 10);
            ctx.lineTo(20, 10);
            ctx.lineTo(-15, 40);
            ctx.lineTo(-5, 15);
            ctx.lineTo(-20, 15);

            ctx.fillStyle = "blue";
            ctx.fill();

            //signaling that I'm done drawing
            ctx.restore();
        }

        requestAnimationFrame(gameLoop)


    </script>
  </body>
</html>
