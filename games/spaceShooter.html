<html>
  <head>
    <title>Game Loop</title>
    <style>
        *{
            margin: 0;
            overflow: hidden;
        }
    </style>
  </head>
  <body>
    <canvas id="canv"> </canvas>
    <script src="../engine/Vector2.js"></script>
    <script src="../engine/Engine.js"></script>
    <script src="../engine/Input.js"></script>
    <script>
        
        let position = new Vector2(250, 250);
        
        function update() {
            //console.log(Input.keysDown)
            if (Input.keysDown.includes("KeyD")) {
                position.x = position.x + 100
    
            }
            if (Input.keysDown.includes("KeyA")) {
                position.x = position.x - 100
    
            }
            if (Input.keysDown.includes("KeyW")) {
                position.y = position.y - 100
    
            }
            if (Input.keysDown.includes("KeyS")) {
                position.y = position.y + 100
    
            }
            
        }
        
        function draw(ctx) {
            
            //Signaling to the context that I'm going to draw something
            ctx.save();

            //set center of our object
            ctx.translate(position.x, position.y);

            //lightning draw from center just set in line 20
            ctx.lineTo(-100, -100);
            ctx.lineTo(100, -100);
            ctx.lineTo(0, 100);
            ctx.lineTo(200, 100);
            ctx.lineTo(-150, 400);
            ctx.lineTo(-50, 150);
            ctx.lineTo(-200, 150);

            ctx.fillStyle = "blue";
            ctx.fill();

            //signaling that I'm done drawing
            ctx.restore();
        }

        //start the engine
        Engine.start()


    </script>
  </body>
</html>
