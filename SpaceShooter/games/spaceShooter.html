<html>
  <head>
    <title>Game Loop</title>
    <style>
        *{
            margin: 0;
            overflow: hidden;
        }
    </style>
  </head>
  <body>
    <canvas id="canv"> </canvas>

    <!--Engine scripts-->
    <script src="../engine/Vector2.js"></script>
    <script src="../engine/Engine.js"></script>
    <script src="../engine/Input.js"></script>
    <script src="../engine/Scene.js"></script>
    <script src="../engine/SceneManager.js"></script>
    <script src="../engine/Time.js"></script>
    <script src="../engine/GameObject.js"></script>
    <script src="../engine/Component.js"></script>
    <script src="../engine/Collisions.js"></script>

    <script src="../engine/components/Transform.js"></script>
    <script src="../engine/components/Polygon.js"></script>
    <script src="../engine/components/TextLabel.js"></script>
    <script src="../engine/components/Camera.js"></script>
    <script src="../engine/components/MultiLineText.js"></script>
    <script src="../engine/components/Collider.js"></script>

    <!--Game Specific scripts-->
    <script src="../games/scenes/Level01.js"></script>
    <script src="../games/scenes/Level02.js"></script>
    <script src="../games/scenes/GenericLevel.js"></script>
    
    <script src="../games/gameObjects/PlayerGameObject.js"></script>
    <script src="../games/gameObjects/LaserGameObject.js"></script>
    <script src="../games/gameObjects/EnemyGameObject.js"></script>
    <script src="../games/gameObjects/PointsGameObject.js"></script>
    <script src="../games/gameObjects/LevelControllerGameObject.js"></script>
    <script src="../games/gameObjects/HelperGameObject.js"></script>

    <script src="../games/components/UpdateComponent.js"></script>
    <script src="../games/components/LaserController.js"></script>
    <script src="../games/components/EnemyController.js"></script>
    <script src="../games/components/LevelController.js"></script>
    <script src="../games/components/PointsController.js"></script>
    <script src="../games/components/Health.js"></script>
    <script src="../games/components/SceneTimerController.js"></script>
    
    <script src="../games/Assets.js"></script>
    <script src="../games/Globals.js"></script>
    <script src="../games/Settings.js"></script>
    <script>
        
        
        //start the engine
        Engine.start(Level01, Settings)

        let gameObject = new GameObject()
        gameObject.addComponent(new Polygon(), {points: [
          new Vector2(0, -1),
          new Vector2(-1, 1),
          new Vector2(1, 1)
        ]})
        gameObject.addComponent(new Collider())

        let two = new GameObject()
        two.addComponent(new Polygon(), {points: [
          new Vector2(0, -1),
          new Vector2(-1, 1),
          new Vector2(1, 1)
        ]})
        two.addComponent(new Collider())


        console.assert(Collisions.isCollisionPointPolygon(new Vector2(0, 0), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(10000, 10000), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0, 1.1), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0, -1.1), gameObject))



        console.assert(Collisions.isCollisionPolygonPolygon(gameObject, two))
        two.transform.position = new Vector2(1000, 1000)
        console.assert(!Collisions.isCollisionPolygonPolygon(gameObject, two))

    </script>
  </body>
</html>
